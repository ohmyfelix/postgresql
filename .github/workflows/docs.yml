name: Docs

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate dictionary files
        run: make test

      - name: Validate README links
        run: |
          grep -F 'https://github.com/dockette/.github/blob/master/CONTRIBUTING.md' README.md
          grep -F 'https://github.com/sponsors/f3l1x' README.md
          grep -F 'https://github.com/orgs/dockette/discussions' README.md
